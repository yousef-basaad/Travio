# Supabase CLI project config — root of the repo.
# Running `supabase <command>` from the repo root now works out of the box,
# since the CLI auto-discovers ./supabase relative to the current directory.
project_id = "travio"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Local dev site + all 4 apps as allowed redirect targets so Supabase Auth
# (email links, OAuth callbacks) works against every app during local dev.
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3000",
  "http://127.0.0.1:3001",
  "http://127.0.0.1:3002",
  "http://127.0.0.1:3003",
  # Signup confirmation emails land on the dashboard's /login
  # (emailRedirectTo = NEXT_PUBLIC_DASHBOARD_URL + /login?confirmed=1).
  "http://127.0.0.1:3001/**",
  "http://localhost:3001/**",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Mirrors production ("Confirm email" ON): signUp returns no session,
# and the agency is created on the owner's first dashboard sign-in.
enable_confirmations = true

[edge_runtime]
enabled = true

[analytics]
enabled = false
